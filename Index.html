<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Aranza Zuriel 🌻</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Segoe UI", sans-serif;

    background:
        linear-gradient(
            to bottom,
            #78b9e8 0%,
            #a9d5f2 45%,
            #dcecf5 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}


/* =========================
   NUBES
========================= */

.cloud{
    position:absolute;
    background:rgba(255,255,255,.72);
    border-radius:100px;
    filter:blur(2px);
    box-shadow:0 10px 30px rgba(80,110,130,.12);
    animation:moveCloud linear infinite;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud::before{
    width:100px;
    height:100px;
    left:35px;
    bottom:10px;
}

.cloud::after{
    width:140px;
    height:140px;
    right:30px;
    bottom:5px;
}

.cloud1{
    width:260px;
    height:70px;
    top:12%;
    left:-300px;
    animation-duration:45s;
}

.cloud2{
    width:330px;
    height:85px;
    top:28%;
    left:-400px;
    animation-duration:60s;
    animation-delay:8s;
    opacity:.6;
}

.cloud3{
    width:230px;
    height:65px;
    top:65%;
    left:-300px;
    animation-duration:50s;
    animation-delay:15s;
    opacity:.5;
}

@keyframes moveCloud{
    from{
        transform:translateX(-350px);
    }

    to{
        transform:translateX(calc(100vw + 500px));
    }
}


/* =========================
   BRILLOS
========================= */

.sparkle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 15px white;
    animation:twinkle 2.5s infinite ease-in-out;
}

@keyframes twinkle{

    0%,100%{
        opacity:.1;
        transform:scale(.5);
    }

    50%{
        opacity:.9;
        transform:scale(1.5);
    }
}


/* =========================
   TARJETA
========================= */

.card{
    position:relative;
    z-index:10;

    width:min(94%,760px);
    min-height:700px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:30px 20px;

    background:rgba(255,255,255,.20);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.55);

    border-radius:40px;

    box-shadow:
        0 30px 70px rgba(45,80,110,.30),
        inset 0 0 40px rgba(255,255,255,.20);

    animation:cardIn 1.5s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(50px) scale(.9);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   RAMO
   NO CAMBIAR
========================= */

.bouquet{
    position:relative;

    width:570px;
    height:500px;

    animation:bouquetFloat 5s ease-in-out infinite;

    flex-shrink:0;
}

@keyframes bouquetFloat{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-10px) rotate(.7deg);
    }
}


/* =========================
   TALLOS
========================= */

.stem{
    position:absolute;

    width:9px;
    height:300px;

    left:50%;
    bottom:20px;

    background:
        linear-gradient(
            to right,
            #1b5e20,
            #4caf50,
            #2e7d32
        );

    border-radius:20px;

    transform-origin:bottom;

    box-shadow:
        3px 5px 8px rgba(0,0,0,.2);
}

.s1{transform:rotate(-38deg);}
.s2{transform:rotate(-27deg);}
.s3{transform:rotate(-16deg);}
.s4{transform:rotate(-7deg);}
.s5{transform:rotate(5deg);}
.s6{transform:rotate(16deg);}
.s7{transform:rotate(28deg);}
.s8{transform:rotate(39deg);}


/* =========================
   HOJAS
========================= */

.leaf{
    position:absolute;

    width:95px;
    height:42px;

    background:
        linear-gradient(
            135deg,
            #1b5e20,
            #4caf50,
            #81c784
        );

    border-radius:100% 0 100% 0;

    box-shadow:
        3px 5px 8px rgba(0,0,0,.2);

    opacity:.95;
}

.l1{
    left:80px;
    bottom:170px;
    transform:rotate(25deg);
}

.l2{
    left:125px;
    bottom:105px;
    transform:rotate(-25deg);
}

.l3{
    right:80px;
    bottom:180px;
    transform:rotate(155deg);
}

.l4{
    right:120px;
    bottom:110px;
    transform:rotate(200deg);
}

.l5{
    left:210px;
    bottom:75px;
    transform:rotate(10deg);
}

.l6{
    right:205px;
    bottom:75px;
    transform:rotate(170deg);
}


/* =========================
   GIRASOLES
   EXACTAMENTE COMO TU VERSIÓN
========================= */

.sunflower{
    position:absolute;

    width:145px;
    height:145px;

    display:flex;
    justify-content:center;
    align-items:center;

    animation:sway 3.5s ease-in-out infinite;

    filter:
        drop-shadow(
            0 10px 8px rgba(65,50,0,.28)
        );
}


/* posiciones */

.f1{
    left:45px;
    top:100px;
    transform:scale(.82);
}

.f2{
    left:125px;
    top:35px;
    transform:scale(.9);
    animation-delay:.4s;
}

.f3{
    left:215px;
    top:5px;
    transform:scale(1.05);
    animation-delay:.8s;
}

.f4{
    right:115px;
    top:35px;
    transform:scale(.92);
    animation-delay:1.1s;
}

.f5{
    right:35px;
    top:105px;
    transform:scale(.82);
    animation-delay:1.5s;
}

.f6{
    left:105px;
    top:170px;
    transform:scale(.75);
    animation-delay:1.8s;
}

.f7{
    right:105px;
    top:170px;
    transform:scale(.76);
    animation-delay:2s;
}

.f8{
    left:215px;
    top:125px;
    transform:scale(.95);
    animation-delay:2.3s;
}

@keyframes sway{

    0%,100%{
        margin-left:0;
    }

    50%{
        margin-left:5px;
    }
}


/* =========================
   PÉTALOS
========================= */

.petal{
    position:absolute;

    width:39px;
    height:72px;

    left:53px;
    top:-5px;

    background:
        linear-gradient(
            to bottom,
            #fff176,
            #ffd600,
            #f9a825
        );

    border-radius:50% 50% 45% 45%;

    transform-origin:20px 76px;

    box-shadow:
        inset 2px 2px 6px rgba(255,255,255,.5),
        2px 4px 6px rgba(120,80,0,.2);
}

.petal:nth-child(1){transform:rotate(0deg)}
.petal:nth-child(2){transform:rotate(30deg)}
.petal:nth-child(3){transform:rotate(60deg)}
.petal:nth-child(4){transform:rotate(90deg)}
.petal:nth-child(5){transform:rotate(120deg)}
.petal:nth-child(6){transform:rotate(150deg)}
.petal:nth-child(7){transform:rotate(180deg)}
.petal:nth-child(8){transform:rotate(210deg)}
.petal:nth-child(9){transform:rotate(240deg)}
.petal:nth-child(10){transform:rotate(270deg)}
.petal:nth-child(11){transform:rotate(300deg)}
.petal:nth-child(12){transform:rotate(330deg)}


/* =========================
   CENTRO
========================= */

.center{
    position:absolute;

    width:63px;
    height:63px;

    border-radius:50%;

    z-index:5;

    background:
        radial-gradient(
            circle at 35% 30%,
            #a66a1c,
            #6d3f0b 55%,
            #382006
        );

    box-shadow:
        inset 4px 5px 10px rgba(255,255,255,.15),
        0 4px 8px rgba(0,0,0,.35);
}


/* =========================
   MENSAJE
========================= */

.message{
    position:relative;

    z-index:20;

    width:100%;

    text-align:center;

    margin-top:-5px;

    padding:5px 10px 15px;

    animation:messageIn 2.5s ease;
}

.message h1{

    font-family:Georgia,serif;

    font-size:
        clamp(
            2.3rem,
            7vw,
            4.3rem
        );

    color:#fff;

    text-shadow:
        0 3px 8px rgba(50,80,100,.45),
        0 0 20px rgba(255,255,255,.4);

    letter-spacing:2px;
}

.message p{

    margin-top:12px;

    color:white;

    font-size:1.1rem;

    letter-spacing:4px;

    text-shadow:
        0 2px 5px rgba(50,70,90,.4);
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   PÉTALOS CAYENDO
========================= */

.falling{
    position:absolute;

    top:-40px;

    width:15px;
    height:25px;

    background:
        linear-gradient(
            135deg,
            #fff176,
            #fbc02d
        );

    border-radius:100% 0 100% 0;

    opacity:.8;

    animation:fall linear infinite;

    z-index:3;
}

@keyframes fall{

    0%{
        transform:
            translateY(-50px)
            translateX(0)
            rotate(0);

        opacity:0;
    }

    10%{
        opacity:.8;
    }

    50%{
        transform:
            translateY(50vh)
            translateX(90px)
            rotate(180deg);
    }

    100%{
        transform:
            translateY(110vh)
            translateX(-80px)
            rotate(360deg);

        opacity:0;
    }
}


/* =========================
   MÓVIL
========================= */

@media(max-width:650px){

    body{
        overflow:hidden;
    }

    .card{

        width:94%;

        min-height:700px;

        padding:
            25px 10px 30px;

        border-radius:30px;
    }


    /*
       AQUÍ ESTÁ LA CORRECCIÓN.

       El ramo conserva EXACTAMENTE
       sus posiciones y proporciones.

       Solamente se escala para que
       quepa en el celular.
    */

    .bouquet{

        transform:scale(.72);

        margin-top:-55px;

        /*
           Antes era -50px.
           Eso hacía que el mensaje
           se metiera demasiado en el ramo.
        */

        margin-bottom:-5px;
    }


    /*
       Dejamos espacio independiente
       entre el ramo y el mensaje.
    */

    .message{

        margin-top:5px;

        padding-top:5px;

        z-index:30;
    }


    .message h1{

        font-size:2.5rem;

        line-height:1.15;

        letter-spacing:1px;
    }


    .message p{

        font-size:.9rem;

        letter-spacing:4px;

        margin-top:14px;
    }
}

</style>
</head>
